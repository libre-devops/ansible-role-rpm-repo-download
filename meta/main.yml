    and checksums
  license: MIT
  min_ansible_version: "2.16"
  issue_tracker_url: https://github.com/libre-devops/ansible-role-rpm-repo-download/issues
  platforms:
    - name: EL
      versions:
        - all
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
  galaxy_tags:
    - rpm
    - yum
    - dnf
    - repository
    - mirror
    - microsoft
    - satellite

dependencies: []
